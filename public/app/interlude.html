<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/app/">
<title>WATARI · One agent, every CFO job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b3b7a;--navy-d:#062a5b;--cyan:#00aeef;--cyan-soft:#e3f6fd;--cyan-line:#bfe9fa;
  --ink:#0b1f33;--ink-2:#34435a;--muted:#5a6b7d;--faint:#8a97a8;--line:#e3e9f1;--line-2:#d3dce8;
  --bg:#f4f7fb;--ok:#12b76a;--ok-d:#067647;--ok-soft:#e9f9f0;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;--ease:cubic-bezier(.2,.8,.2,1);
  --sh-1:0 1px 2px rgba(11,31,51,.06),0 2px 6px rgba(11,31,51,.05);--sh-2:0 10px 30px rgba(6,42,91,.12),0 2px 6px rgba(6,42,91,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#e6ecf4;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:absolute;left:50%;top:50%;width:1600px;height:940px;transform-origin:center;background:var(--bg);overflow:hidden;transform:translate(-50%,-50%)}
#app::before{content:"";position:absolute;inset:0;background:radial-gradient(760px 420px at 800px 560px,rgba(0,174,239,.08),transparent 70%),radial-gradient(#e3e9f1 1px,transparent 1.2px) 0 0/18px 18px;opacity:.9}

/* header (d2) */
.hdr{position:absolute;left:16px;right:16px;top:12px;height:50px;display:flex;align-items:center;gap:12px;z-index:5}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 14%,#7fd8ff 34%,#1e8bff 70%,#1f5fe0 100%);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line),0 4px 14px rgba(0,174,239,.35)}
.logo b{display:block;font-weight:800;letter-spacing:.16em;font-size:15px;color:var(--navy-d)}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.sp{flex:1}
.tag{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* headline */
.head{position:absolute;left:0;right:0;top:92px;text-align:center;z-index:5}
.head .k{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--mono);letter-spacing:.1em;color:#036b95;text-transform:uppercase;
  background:var(--cyan-soft);border:1px solid var(--cyan-line);padding:4px 12px;border-radius:999px}
.head .k svg{width:13px;height:13px}
.head h1{font-size:54px;font-weight:800;letter-spacing:-.025em;line-height:1.06;margin-top:18px;color:var(--ink)}
.head h1 em{font-style:normal;background:linear-gradient(90deg,var(--navy) 0%,#1e8bff 60%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{font-size:16px;color:var(--muted);margin-top:14px;font-weight:500}
.head p b{color:var(--ink-2);font-weight:600}

/* cover-flow ring */
.scene{position:absolute;left:0;right:0;top:250px;height:540px;perspective:1800px;perspective-origin:50% 50%;z-index:3}
.floor{position:absolute;left:50%;top:412px;width:1000px;height:70px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(6,42,91,.13),rgba(6,42,91,.04) 60%,transparent)}
.ring{position:absolute;left:50%;top:244px;transform-style:preserve-3d}
.card{position:absolute;left:0;top:0;width:420px;height:286px;margin:-143px 0 0 -210px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 26px 22px;
  display:flex;flex-direction:column;backface-visibility:hidden;cursor:pointer;
  box-shadow:0 0 0 calc(var(--f,0) * 6px) rgba(0,174,239,calc(var(--f,0) * .12)),0 1px 2px rgba(11,31,51,.06),0 10px 22px -8px rgba(6,42,91,calc(.08 + var(--f,0) * .16));
  border-color:rgba(0,174,239,calc(var(--f,0) * .55))}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;background:var(--bg);opacity:var(--dim,0);pointer-events:none}
.card .top{display:flex;align-items:center;gap:10px}
.card .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--navy);flex:none;transition:background .4s,color .4s,border-color .4s}
.card .ic svg{width:22px;height:22px}
.card.front .ic{background:var(--navy-d);border-color:var(--navy-d);color:#fff}
.card .no{margin-left:auto;font:600 10.5px var(--mono);color:var(--faint);letter-spacing:.04em}
.card .st{margin-left:auto;display:none;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.card .st svg{width:12px;height:12px;stroke-width:2.6}
.card.done .st{display:inline-flex;background:var(--ok-soft);border:1px solid #c5efd8;color:var(--ok-d)}
.card.next .st{display:inline-flex;background:var(--cyan-soft);border:1px solid var(--cyan-line);color:#036b95}
.card.done .no,.card.next .no{display:none}
.card h3{font-size:22px;font-weight:800;letter-spacing:-.015em;margin-top:18px;line-height:1.2}
.card h3 span{display:block;font-size:14px;font-weight:600;color:var(--faint);letter-spacing:0;margin-top:3px}
.card p{font-size:14.5px;line-height:1.5;color:var(--muted);margin-top:10px}
.card .ps{margin-top:auto;display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.card .ps small{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:3px}
.pill{font:500 10.5px var(--mono);padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.card.next.land{animation:land 1.6s var(--ease) 1}
@keyframes land{0%{outline:0 solid rgba(0,174,239,.5);outline-offset:0}40%{outline:3px solid rgba(0,174,239,.45);outline-offset:6px}100%{outline:3px solid rgba(0,174,239,0);outline-offset:16px}}

/* footer: dots + next hint */
.dots{position:absolute;left:50%;top:716px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:5}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line-2);transition:width .35s var(--ease),background .35s}
.dots i.d{background:var(--ok)}
.dots i.n{background:var(--cyan)}
.dots i.on{width:22px;background:var(--navy-d)}
.hint{position:absolute;left:50%;top:752px;transform:translate(-50%,8px);opacity:0;z-index:5;display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:var(--sh-2);font-size:13px;font-weight:600;color:var(--ink-2);
  transition:opacity .6s var(--ease),transform .6s var(--ease)}
.hint.on{opacity:1;transform:translate(-50%,0)}
.hint b{color:var(--ink)}
.hint .go{width:28px;height:28px;border-radius:50%;border:0;background:var(--navy-d);color:#fff;display:grid;place-items:center}
.hint .go svg{width:15px;height:15px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.keys{position:absolute;right:20px;bottom:16px;font:500 9.5px var(--mono);color:var(--faint);z-index:5}
@media (prefers-reduced-motion:reduce){.hint .go svg{animation:none}.card.next.land{animation:none}.hint{transition:opacity .3s}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo"><span class="mk"></span><div><b>WATARI</b><small>CFO agent</small></div></div>
    <span class="sp"></span>
    <span class="tag">Interlude</span>
  </div>

  <div class="head">
    <span class="k" id="kick"></span>
    <h1>One CFO agent. <em>Every job a CFO does.</em></h1>
    <p>Same agent, same connections, same guardrails. <b>You just saw one job. Here is the next.</b></p>
  </div>

  <div class="scene" id="scene"><div class="floor"></div><div class="ring" id="ring"></div></div>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint"><span>Next: <b>Investor update</b> · Q3 board report</span><button class="go" id="go" title="Go to the investor update"></button></div>
  <div class="keys">← → browse</div>
</div>

<script>
const ICONS={"PhoneCall": "<path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"/><path d=\"M14.05 2a9 9 0 0 1 8 7.94\"/><path d=\"M14.05 6A5 5 0 0 1 18 10\"/>", "Flame": "<path d=\"M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z\"/>", "MailWarning": "<path d=\"M22 10.5V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h12.5\"/><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"/><path d=\"M20 14v4\"/><path d=\"M20 22v.01\"/>", "Landmark": "<line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"/><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"/><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"/><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"/><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"/><polygon points=\"12 2 20 7 4 7\"/>", "ShieldAlert": "<path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/><path d=\"M12 8v4\"/><path d=\"M12 16h.01\"/>", "Scissors": "<circle cx=\"6\" cy=\"6\" r=\"3\"/><path d=\"M8.12 8.12 12 12\"/><path d=\"M20 4 8.12 15.88\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><path d=\"M14.8 14.8 20 20\"/>", "CalendarCheck": "<path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/><path d=\"m9 16 2 2 4-4\"/>", "FileChartColumn": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"/><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"/><path d=\"M8 18v-1\"/><path d=\"M12 18v-6\"/><path d=\"M16 18v-3\"/>", "FolderLock": "<rect width=\"8\" height=\"5\" x=\"14\" y=\"17\" rx=\"1\"/><path d=\"M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v2.5\"/><path d=\"M20 17v-2a2 2 0 1 0-4 0v2\"/>", "Award": "<path d=\"m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526\"/><circle cx=\"12\" cy=\"8\" r=\"6\"/>", "ArrowLeftRight": "<path d=\"M8 3 4 7l4 4\"/><path d=\"M4 7h16\"/><path d=\"m16 21 4-4-4-4\"/><path d=\"M20 17H4\"/>", "Check": "<path d=\"M20 6 9 17l-5-5\"/>", "ArrowRight": "<path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/>", "Sparkles": "<path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z\"/><path d=\"M20 3v4\"/><path d=\"M22 5h-4\"/><path d=\"M4 17v2\"/><path d=\"M5 18H3\"/>"};
const svg=k=>`<svg class="i" viewBox="0 0 24 24">${ICONS[k]}</svg>`;
const $=s=>document.querySelector(s);
const APP=$('#app');
function fit(){const s=Math.min(innerWidth/1600,innerHeight/940);APP.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* eleven real startup-CFO jobs. 0 = the call you just saw, 7 = the demo coming up */
const JOBS=[
  {ic:'PhoneCall',      n:'Payroll at risk',  s:'The call',        g:'Spots the cash gap before payday and calls you to close it.',              p:['KBC','SD Worx','Stripe'], st:'done'},
  {ic:'Flame',          n:'Burn & runway',    s:'Weekly alert',           g:'Tracks weekly burn against plan. Pings you when runway drops below 9 months.', p:['KBC','Xero']},
  {ic:'MailWarning',    n:'Late invoices',    s:'Polite chasing',         g:'Finds overdue invoices and sends polite reminders that escalate on schedule.',  p:['Stripe','Gmail']},
  {ic:'Landmark',       n:'VAT return',       s:'Quarterly prep',            g:'Matches every receipt to a transaction and drafts the quarterly return.',   p:['Xero','Intervat']},
  {ic:'ShieldAlert',    n:'Expense check',    s:'Suspicious spend',g:'Flags duplicate, out-of-policy or odd card spend the moment it happens.', p:['Spendesk','KBC']},
  {ic:'Scissors',       n:'SaaS cleanup',     s:'Subscriptions',   g:'Lists every subscription, finds unused seats and tools that overlap.',     p:['Ramp','Google']},
  {ic:'CalendarCheck',  n:'Month-end close',  s:'Monthly',           g:'Reconciles the bank, books accruals, hands your accountant a clean ledger.', p:['Xero','KBC']},
  {ic:'FileChartColumn',n:'Investor update',  s:'Q3 board report', g:'Pulls the numbers, writes the update, sends it to every investor.',         p:['Stripe','Attio','Gmail'], st:'next'},
  {ic:'FolderLock',     n:'Data room',        s:'Fundraising',     g:'Builds the due diligence data room and keeps every file current.',         p:['Dropbox','DocuSign']},
  {ic:'Award',          n:'Grant finder',     s:'Subsidies',       g:'Matches your R&D spend to VLAIO and EU grants and drafts the application.',  p:['VLAIO','EIC']},
  {ic:'ArrowLeftRight', n:'Treasury sweep',   s:'FX & idle cash',       g:'Moves idle cash to savings and buys USD for US bills at the right rate.',   p:['KBC','Wise']}
];
const N=JOBS.length,STEP=2*Math.PI/N,R=830,DONE=0,NEXT=7;

$('#kick').innerHTML=svg('Sparkles')+'One agent · '+N+' CFO jobs';
$('#go').innerHTML=svg('ArrowRight');
$('#ring').innerHTML=JOBS.map((j,i)=>`<div class="card${j.st?' '+j.st:''}" data-i="${i}">
  <div class="top"><span class="ic">${svg(j.ic)}</span><span class="no">${String(i+1).padStart(2,'0')} / ${N}</span>
  <span class="st">${j.st==='done'?svg('Check')+'You just saw this':j.st==='next'?'Next'+svg('ArrowRight'):''}</span></div>
  <h3>${j.n}<span>${j.s||'&nbsp;'}</span></h3>
  <p>${j.g}</p>
  <div class="ps"><small>Works with</small>${j.p.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
</div>`).join('');
$('#dots').innerHTML=JOBS.map((j,i)=>`<i class="${i===DONE?'d':i===NEXT?'n':''}"></i>`).join('');
const CARDS=[...document.querySelectorAll('.card')],DOTS=[...document.querySelectorAll('.dots i')];

let pos=0,raf=0,gen=0,running=false;
const wrap=d=>((d%N)+N+N/2)%N-N/2;
function render(){
  const fi=((Math.round(pos)%N)+N)%N;
  CARDS.forEach((c,i)=>{
    const d=wrap(i-pos),a=Math.abs(d),th=d*STEP;
    const x=Math.sin(th)*R,z=(Math.cos(th)-1)*R;
    const op=a<1.4?1:Math.max(0,1-(a-1.4)*1.05);
    c.style.transform=`translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${(th*0.6*180/Math.PI).toFixed(2)}deg)`;
    c.style.opacity=op.toFixed(3);
    c.style.visibility=op<.01?'hidden':'visible';
    c.style.zIndex=String(100-Math.round(a*10));
    c.style.setProperty('--f',Math.max(0,1-a*1.6).toFixed(3));
    c.style.setProperty('--dim',Math.min(.62,a*.36).toFixed(3));
    c.classList.toggle('front',i===fi&&a<.35);
  });
  DOTS.forEach((d,i)=>d.classList.toggle('on',i===fi));
}
const easeIO=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=(ms,g)=>new Promise(r=>setTimeout(()=>r(g===gen),ms));

/* glide from a to b; a>0 dwell makes it tick through each card instead of a blur */
function tween(a,b,ms,dwell,g){
  return new Promise(res=>{
    const t0=performance.now();
    const f=now=>{
      if(g!==gen) return res(false);
      const u=Math.min(1,(now-t0)/ms),x=easeIO(u)*(b-a);
      pos=a+x-dwell*Math.sin(2*Math.PI*x)/(2*Math.PI)*Math.sign(b-a||1);
      render();
      if(u<1) raf=requestAnimationFrame(f); else {pos=b;render();res(true);}
    };
    raf=requestAnimationFrame(f);
  });
}
function landed(){
  $('#hint').classList.add('on');
  const c=CARDS[NEXT];c.classList.remove('land');void c.offsetWidth;c.classList.add('land');
}
async function play(){
  const g=++gen;running=true;cancelAnimationFrame(raf);
  pos=DONE;render();$('#hint').classList.remove('on');CARDS[NEXT].classList.remove('land');
  if(reduced){ if(!await wait(1600,g)) return; pos=NEXT;render();landed();running=false;return; }
  if(!await wait(1300,g)) return;            // hold on the call you just saw
  if(!await tween(DONE,NEXT,5600,.82,g)) return; // tick through the jobs, land on the investor update (~6.9 s)
  landed();running=false;
}
async function step(dir){
  const g=++gen;running=false;cancelAnimationFrame(raf);
  const to=Math.round(pos)+dir;
  if(await tween(pos,to,reduced?1:480,0,g)){pos=((to%N)+N)%N;render();if(pos===NEXT)landed();}
}

window.WATARI_STEP={
  start(){ if(!running) play(); },
  reset(){ play(); },
  pause(){ gen++;cancelAnimationFrame(raf);running=false; }
};

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
});
$('#ring').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const d=Math.round(wrap(+c.dataset.i-pos));if(d) step(d);
});
$('#go').onclick=()=>{ if(parent!==window) parent.postMessage({watari:'nav',dir:1},location.origin); };

render();play();
</script>
<script src="/app/bridge.js"></script>
</body>
</html>
