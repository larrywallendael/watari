<style>
:root{--ink:#fff;--mute:rgba(255,255,255,.64);--faint:rgba(255,255,255,.38);--line:rgba(255,255,255,.13);--cyan:#00aeef;--cy2:#7fd8ff;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0b0d;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#slide{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1100px 760px at 50% 56%,#26282d 0%,#18191c 45%,#111113 100%)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:.22em;font-size:17px}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff 0 14%,#7fd8ff 38%,#1e8bff 72%,#1f5fe0 100%);box-shadow:0 0 18px rgba(0,174,239,.55)}
.tag{position:absolute;right:72px;top:56px;height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;font-size:15px;color:var(--mute);font-weight:500}
h1{position:absolute;left:0;right:0;top:122px;margin:0 auto;max-width:1460px;text-align:center;font-size:56px;font-weight:600;letter-spacing:-.032em;line-height:1.12}
h1 em{font-style:normal;color:var(--cy2)}
.pg{position:absolute;right:72px;bottom:44px;font-size:13px;color:var(--faint);letter-spacing:.08em}
.fx{opacity:0;transform:translateY(10px);animation:in .9s var(--ease) forwards}
@keyframes in{to{opacity:1;transform:none}}
canvas.orb{position:absolute}
#wires{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
#wires path{fill:none;stroke:rgba(140,215,255,.26);stroke-width:1.4;stroke-dasharray:3 9;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none}}

.card{position:absolute;width:620px;padding:30px 34px 32px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 30px 60px rgba(0,0,0,.25)}
.card .who{display:inline-flex;align-items:center;gap:13px;height:50px;padding:0 20px 0 8px;border-radius:999px;border:1px solid var(--line);font-size:21px;font-weight:600;color:#fff;letter-spacing:.005em}
.card .who b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,174,239,.18);color:var(--cy2)}
.card .who b svg{width:20px;height:20px}
.card h3{font-size:36px;font-weight:600;letter-spacing:-.02em;margin-top:20px;line-height:1.15}
.card p{font-size:24px;color:var(--mute);margin-top:8px;line-height:1.4}
#c1{left:650px;top:282px;text-align:center}#c1 .who{margin:0 auto}
#c2{left:170px;top:740px}#c3{right:170px;top:740px}

</style></head>

th d="M1060,690 C1120,720 1160,740 1200,760"/><circle r="4" fill="#bfeaff" filter="url(#glow)"><animateMotion dur="2.6s" begin="-0.74s" repeatCount="indefinite" path="M1060,690 C1120,720 1160,740 1200,760"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.6s" begin="-0.74s" repeatCount="indefinite"/></circle><circle r="4" fill="#bfeaff" filter="url(#glow)"><animateMotion dur="2.6s" begin="-1.61s" repeatCount="indefinite" path="M1060,690 C1120,720 1160,740 1200,760"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.6s" begin="-1.61s" repeatCount="indefinite"/></circle><circle r="4" fill="#bfeaff" filter="url(#glow)"><animateMotion dur="2.6s" begin="-2.47s" repeatCount="indefinite" path="M1060,690 C1120,720 1160,740 1200,760"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.6s" begin="-2.47s" repeatCount="indefinite"/></circle></svg>

<script>
const S=document.getElementById('slide');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);S.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
/* WATARI orb: blue and white bubbles, rotating sphere, orbit rings with travelling lights */
function makeOrb(cv,size,R0){const c=cv.getContext('2d'),W=size,H=size,D=2;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';
 const N=760,P=[];for(let i=0;i<N;i++){const y=1-(i+.5)/N*2,r=Math.sqrt(1-y*y),th=i*2.399963;P.push([Math.cos(th)*r,y,Math.sin(th)*r,.5+((i*7919)%100)/100*.9,(i*104729)%9===0]);}
 const RINGS=[{rx:1.42,ry:.34,tilt:-.32,sp:.00042,n:3},{rx:1.62,ry:.42,tilt:.22,sp:-.0003,n:2}];let rot=0;const t0=performance.now();
 function ball(x,y,r,h,l,a,w){const g=c.createRadialGradient(x-r*.35,y-r*.35,r*.08,x,y,r);g.addColorStop(0,`hsla(${h},100%,${Math.min(98,l+28)}%,${a})`);g.addColorStop(1,`hsla(${h},${w?50:95}%,${l}%,${a})`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();}
 function rings(X,Y,R,t,front){for(const rg of RINGS){c.save();c.translate(X,Y);c.rotate(rg.tilt);c.strokeStyle='rgba(160,220,255,.22)';c.lineWidth=1;c.setLineDash([2,7]);c.beginPath();
  c.ellipse(0,0,R*rg.rx,R*rg.ry,0,front?0:Math.PI,front?Math.PI:Math.PI*2);c.stroke();c.setLineDash([]);
  for(let k=0;k<rg.n;k++){const a=(t*rg.sp*1000+k*2*Math.PI/rg.n)%(2*Math.PI),py=Math.sin(a);if((py>0)!==front)continue;const x=Math.cos(a)*R*rg.rx,y=py*R*rg.ry;
   const gg=c.createRadialGradient(x,y,0,x,y,9);gg.addColorStop(0,'rgba(255,255,255,1)');gg.addColorStop(.35,'rgba(120,215,255,.9)');gg.addColorStop(1,'rgba(0,174,239,0)');c.fillStyle=gg;c.beginPath();c.arc(x,y,9,0,7);c.fill();}
  c.restore();}}
 (function draw(now){const t=(now-t0)/1000;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);const X=W/2,Y=H/2,R=R0*(1+Math.sin(t*1.1)*.015);rot+=.0042;
  let g=c.createRadialGradient(X,Y,0,X,Y,R*2.1);g.addColorStop(0,'rgba(120,215,255,.55)');g.addColorStop(.35,'rgba(0,150,255,.18)');g.addColorStop(1,'rgba(0,120,255,0)');c.fillStyle=g;c.beginPath();c.arc(X,Y,R*2.1,0,7);c.fill();
  rings(X,Y,R,t,false);const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(.38),st=Math.sin(.38);
  const Q=P.map(([x,y,z,s,w])=>{const x1=x*cr-z*sr,z1=x*sr+z*cr;return[x1,y*ct-z1*st,y*st+z1*ct,s,w];}).sort((a,b)=>a[2]-b[2]);
  c.globalCompositeOperation='lighter';for(const[x,y,z,s,w]of Q){const d=(z+1)/2,e=Math.hypot(x,y),r=(1.2+d*2.9)*s*(R/130);ball(X+x*R,Y+y*R,r,w?196:208+e*16,w?92:58-e*14+d*8,.22+d*.7,w);}
  c.globalCompositeOperation='source-over';g=c.createRadialGradient(X,Y,0,X,Y,R*.55);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(X,Y,R*.55,0,7);c.fill();
  rings(X,Y,R,t,true);requestAnimationFrame(draw);})(t0);}
document.querySelectorAll('canvas.orb').forEach(cv=>makeOrb(cv,+cv.dataset.size,+cv.dataset.r));
</script><script src="/app/bridge.js"></script></body></html>
