<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/d2/">
<link rel="icon" href="data:,">
<title>WATARI · Investor update agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b3b7a;--navy-d:#062a5b;--cyan:#00aeef;--cyan-soft:#e3f6fd;--cyan-line:#bfe9fa;
  --ink:#0b1f33;--ink-2:#34435a;--muted:#5a6b7d;--faint:#8a97a8;--line:#e3e9f1;--line-2:#d3dce8;
  --bg:#f4f7fb;--card:#fff;--ok:#12b76a;--ok-d:#067647;--ok-soft:#e9f9f0;--warn:#b54708;--warn-soft:#fff4e5;--violet:#5b4bd6;--violet-soft:#f1efff;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;--ease:cubic-bezier(.2,.8,.2,1);
  --sh-1:0 1px 2px rgba(11,31,51,.06),0 2px 6px rgba(11,31,51,.05);--sh-2:0 10px 30px rgba(6,42,91,.12),0 2px 6px rgba(6,42,91,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#e6ecf4;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:absolute;left:50%;top:50%;width:1600px;height:940px;transform-origin:center;background:var(--bg);overflow:hidden}
.instant *,.instant *::before,.instant *::after{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}

/* ---------- header ---------- */
.hdr{position:absolute;left:16px;right:16px;top:12px;height:50px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 14%,#7fd8ff 34%,#1e8bff 70%,#1f5fe0 100%);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line),0 4px 14px rgba(0,174,239,.35)}
.logo b{display:block;font-weight:800;letter-spacing:.16em;font-size:15px;color:var(--navy-d)}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.co{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 6px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.co .av{width:24px;height:24px;border-radius:7px;background:#0b1f33;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.co span{color:var(--muted);font-weight:500}
.sp{flex:1}
.rail{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.rail button{display:flex;align-items:center;gap:7px;border:0;background:none;height:32px;padding:0 12px 0 6px;border-radius:9px;font-size:12px;font-weight:600;color:var(--faint);position:relative;white-space:nowrap}
.rail button .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--mono);background:var(--bg);color:var(--faint);border:1px solid var(--line)}
.rail button .n svg{width:11px;height:11px;stroke-width:3}
.rail button:hover{color:var(--navy)}
.rail button.done{color:var(--ink-2)}
.rail button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rail button.cur{background:var(--navy-d);color:#fff}
.rail button.cur .n{background:#fff;color:var(--navy-d);border-color:#fff}
.rail button .bar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;display:none}
.rail button.cur .bar{display:block}
.rail button .bar i{display:block;height:100%;width:0;background:var(--cyan)}
.runbtn{white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:10.5px;font-weight:600;color:var(--faint)}
.runbtn svg{width:12px;height:12px}
.runbtn:hover,.runbtn.on{color:var(--ink-2);border-color:var(--line-2);background:#fff}
.ctrl{display:flex;gap:6px}
.ctrl button{height:34px;min-width:34px;padding:0 9px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font:600 11px var(--mono);color:var(--ink-2)}
.ctrl button:hover{border-color:var(--cyan)}
.clock{font:500 10.5px var(--mono);color:var(--muted);text-align:right;line-height:1.35;white-space:nowrap}
.clock b{color:var(--ink);font-weight:600}

/* ---------- run info popover ---------- */
.runp{position:absolute;right:16px;top:66px;width:620px;max-height:850px;z-index:300;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(6,42,91,.22);display:none;flex-direction:column;overflow:hidden;color:var(--ink)}
.runp.on{display:flex;animation:pop .3s var(--ease) both}
.runp .rh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.runp .rh small{color:var(--faint);font-weight:500;font-size:11px}
.runp .rh button{margin-left:auto;border:0;background:none;color:var(--faint)}
.rm{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.rm div{padding:10px 16px;border-left:1px solid var(--line)}.rm div:first-child{border-left:0}
.rm .l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rm .v{font:600 17px var(--mono);margin-top:2px}.rm .v small{font-size:11px;color:var(--faint)}
.rtabs{display:flex;gap:4px;padding:10px 16px 0}
.rtabs button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11px;font-weight:600;padding:4px 10px;color:var(--muted)}
.rtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbody{overflow:auto;padding:10px 16px 16px}
.srow{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f3f7;font-size:11.5px}
.srow .fig{font:600 12px var(--mono)}
.srow .fig small{display:block;font:500 10px Inter;color:var(--faint);margin-top:2px}
.srow .used{border:1px solid var(--cyan-line);background:var(--cyan-soft);color:#036b95;border-radius:7px;padding:3px 8px;font-size:10.5px;font-weight:600;width:max-content;display:flex;align-items:center;gap:5px}
.srow .used svg{width:11px;height:11px}
.srow .from{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.srow .det{font-size:10.5px;color:var(--muted);margin-top:4px}
.srow .lk{justify-self:end;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--navy);text-decoration:none;border:1px solid var(--line);padding:4px 8px;border-radius:7px;white-space:nowrap}
.srow .lk svg{width:11px;height:11px}
.srow .lk:hover{border-color:var(--cyan)}
.rnote{font-size:11.5px;color:var(--muted);padding:14px 0;line-height:1.5}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lslot{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--line-2);border-radius:9px;font-size:11px}
.lslot code{font:500 9.5px var(--mono);color:var(--faint);margin-left:auto}
.lslot.ok{border-style:solid;border-color:#c5efd8;background:var(--ok-soft)}
.flash-src{animation:fsrc 1.8s ease 1;border-radius:5px}
@keyframes fsrc{0%,60%{box-shadow:0 0 0 3px var(--cyan),0 0 0 7px rgba(0,174,239,.25);background:rgba(0,174,239,.08)}100%{box-shadow:0 0 0 0 rgba(0,174,239,0)}}

/* ---------- brief strip ---------- */
.brief{position:absolute;left:16px;right:16px;top:72px;height:62px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bf{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 13px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;transition:border-color .5s,box-shadow .5s}
.bf .l{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bf .l svg{width:12px;height:12px}
.bf .v{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.bf .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf .ph{display:inline-block;width:110px;height:10px;border-radius:5px;background:linear-gradient(90deg,#eef2f7 0%,#f7f9fc 50%,#eef2f7 100%);background-size:200% 100%;animation:shim 1.6s linear infinite}
.bf .ph.s2{width:70px;height:7px}
@keyframes shim{to{background-position:-200% 0}}
.bf.got{border-color:var(--cyan-line);box-shadow:0 0 0 3px rgba(0,174,239,.08)}
.bf.got .l{color:#036b95}
.bf.k-period.got{border-color:#d9d2ff;box-shadow:0 0 0 3px rgba(91,75,214,.08)}.bf.k-period.got .l{color:var(--violet)}
.bf.k-aud.got{border-color:#c5efd8;box-shadow:0 0 0 3px rgba(18,183,106,.08)}.bf.k-aud.got .l{color:var(--ok-d)}
.bf.k-due.got{border-color:#fbd9a8;box-shadow:0 0 0 3px rgba(181,71,8,.08)}.bf.k-due.got .l{color:var(--warn)}

/* ---------- logo chips (monogram fallback, image when a logo file is present) ---------- */
.mn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:800;font-size:10px;letter-spacing:-.02em;color:#fff;background:var(--c,#34435a);position:relative;overflow:hidden;transition:width .45s var(--ease),height .45s var(--ease),border-radius .45s}
.mn,.avt{display:grid!important;place-items:center}
.mn img{width:100%;height:100%;object-fit:contain;display:block}
.mn.img{background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding:3px}
.mn.sm{width:18px;height:18px;border-radius:5px;font-size:8px}.mn.sm.img{padding:2px}
.mn.xs{width:15px;height:15px;border-radius:4px;font-size:7px}.mn.xs.img{padding:1px}
.mn.md{width:34px;height:34px;border-radius:9px;font-size:12px}
.mn.lg{width:46px;height:46px;border-radius:12px;font-size:15px}
.mn.ic{background:var(--bg);color:var(--navy);border:1px solid var(--line)}
.mn.ic svg{width:13px;height:13px}
.drop-hint .app,.drop-hint .mn[data-a]{outline:1.5px dashed var(--cyan);outline-offset:2px}

/* ---------- stage ---------- */
.stage{position:absolute;left:16px;top:146px;width:836px;height:778px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 360px at 418px 330px,rgba(0,174,239,.07),transparent 70%),radial-gradient(#e9eef5 1px,transparent 1.2px) 0 0/18px 18px;opacity:.9}
#world{position:absolute;left:0;top:0;width:836px;height:778px;transform-origin:0 0;transition:transform .9s var(--ease)}
.ring{position:absolute;left:100px;top:70px;width:636px;height:600px;border-radius:50%;border:1.5px dashed #dbe3ee}
.ring.r2{left:218px;top:180px;width:400px;height:380px;border:1px solid #eef2f7}
.veil{position:absolute;inset:-200px;z-index:20;background:rgba(244,247,251,.42);opacity:0;pointer-events:none;transition:opacity .5s}
#links{position:absolute;left:0;top:0;width:836px;height:778px;pointer-events:none;z-index:26;overflow:visible}
#links path{fill:none;stroke-width:1.8;stroke-linecap:round;transition:stroke .5s,opacity .5s}
#links path.in{stroke:var(--cyan);stroke-dasharray:3 6;animation:dashIn .9s linear infinite}
#links path.out{stroke:var(--navy-d);stroke-dasharray:6 6;animation:dashOut .9s linear infinite}
#links path.done{stroke:#9ee0bf;stroke-dasharray:none;opacity:.5}
#links path.idle{stroke:#d9e1ec;stroke-dasharray:2 5;opacity:.8}
@keyframes dashIn{to{stroke-dashoffset:18}}
@keyframes dashOut{to{stroke-dashoffset:-24}}
#links circle{filter:drop-shadow(0 0 3px rgba(0,174,239,.6))}
#orb{position:absolute;left:288px;top:200px;width:260px;height:260px;z-index:25}
.mood{position:absolute;left:418px;top:458px;transform:translateX(-50%);z-index:27}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--cyan-soft);border:1px solid var(--cyan-line);color:#036b95;white-space:nowrap;box-shadow:var(--sh-1)}
.chip svg{width:13px;height:13px}
.chip.ok{background:var(--ok-soft);border-color:#c5efd8;color:var(--ok-d)}
.chip.vi{background:var(--violet-soft);border-color:#e0dbff;color:var(--violet)}
.now{position:absolute;left:418px;top:496px;transform:translateX(-50%);width:340px;z-index:27;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;padding:10px 13px 11px;box-shadow:var(--sh-2);display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;transition:width .45s var(--ease),padding .45s}
.now .lgo{grid-row:span 2;display:none}
.now.has .lgo{display:block}
.now .t{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;line-height:1.25}
.now .t svg{width:15px;height:15px;color:var(--navy)}
.now .w{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.now .pg{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.now .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--navy));transition:width .7s var(--ease)}
.now.flash{animation:flash .45s var(--ease)}
@keyframes flash{from{opacity:.75;margin-top:3px}to{opacity:1;margin-top:0}}
.phase-t{position:absolute;left:18px;top:16px;width:215px;z-index:30}
.phase-t .k{font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--cyan);text-transform:uppercase}
.phase-t h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:2px;line-height:1.15}
.phase-t p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.legend{position:absolute;right:14px;top:14px;z-index:30;display:grid;gap:4px;justify-items:end}
.legend div{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);font-weight:500}
.legend svg{width:26px;height:6px}
.ticker{position:absolute;left:14px;bottom:12px;width:218px;z-index:30;display:flex;flex-direction:column;gap:2px;font:500 9.5px var(--mono);color:var(--muted)}
.ticker .h{display:flex;align-items:center;gap:6px;font:700 9px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.ticker .h i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.4s infinite}
.ticker .ln{display:flex;gap:5px;white-space:nowrap;overflow:hidden;animation:lnIn .35s var(--ease) both}
.ticker .ln span:last-child{overflow:hidden;text-overflow:ellipsis}
.ticker .tg{flex:none;font-size:8px;padding:0 4px;border-radius:4px;line-height:14px;font-weight:600}
.tg.in{background:var(--cyan-soft);color:#036b95}.tg.ai{background:var(--violet-soft);color:var(--violet)}.tg.ok{background:var(--ok-soft);color:var(--ok-d)}.tg.lk{background:#eef1f6;color:var(--ink-2)}.tg.wr{background:#fff4e5;color:var(--warn)}
.ticker .ln b{color:var(--ink);font-weight:500}
@keyframes lnIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
.secs{position:absolute;right:14px;bottom:12px;width:214px;z-index:30}
.secs .h{font:700 9px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;text-align:right}
.secs .wrap{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.sec{display:none;align-items:center;gap:4px;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px dashed var(--line-2);color:var(--muted);background:#fff}
.sec svg{width:10px;height:10px}
.sec.req{display:inline-flex;animation:pop .4s var(--ease) both}
.sec.done{display:inline-flex;border-style:solid;border-color:#c5efd8;background:var(--ok-soft);color:var(--ok-d)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* source group cards */
.grp{position:absolute;width:172px;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 6px 5px;box-shadow:var(--sh-1);z-index:5;
  transition:border-color .5s,box-shadow .5s,transform .55s var(--ease),filter .5s,opacity .5s}
.grp h6{font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:2px 5px 5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.grp h6 svg{width:11px;height:11px}
.grp.hot{border-color:var(--cyan-line);box-shadow:0 0 0 4px rgba(0,174,239,.10),var(--sh-2)}
.grp.hot h6{color:#036b95}
.app{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:4px 5px;border-radius:9px;border:1px solid transparent;position:relative;transition:background .4s,border-color .4s,opacity .4s}
.app .nm{font-size:11.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .sb{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.app .tx{min-width:0}
.app .st{display:flex;align-items:center;gap:4px;color:var(--faint)}
.app .st svg{width:12px;height:12px}
.app .bd{font:600 8.5px var(--mono);padding:0 5px;border-radius:5px;background:var(--ok-soft);color:var(--ok-d);white-space:nowrap;display:none;margin-top:2px;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.app.done .sb{display:none}.app.done .bd{display:block}
.app{opacity:.62}
.app.sup{opacity:.42}.app.sup .sb{font-style:italic}
.app.lock,.app.auth,.app.sync,.app.on,.app.active,.app.write,.app.done{opacity:1}
.app.auth{background:#f8fbff;border-color:var(--cyan-line)}
.app.auth .st{color:var(--cyan);animation:blink .8s infinite}
.app.sync .st{color:var(--cyan)}
.app.sync .st svg{animation:spin .9s linear infinite}
.app.on .st{color:var(--ok)}
.app.active,.app.write{background:var(--cyan-soft);border-color:var(--cyan-line);box-shadow:0 0 0 3px rgba(0,174,239,.10)}
.app.active .st,.app.write .st{color:#036b95}
.app.active .st svg{animation:spin 1s linear infinite}
.app.write{background:#f1efff;border-color:#e0dbff;box-shadow:0 0 0 3px rgba(91,75,214,.10)}
.app.write .st{color:var(--violet)}
.app.done .st{color:var(--ok)}
.app .ok{position:absolute;left:23px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;transform:scale(0);transition:transform .35s var(--ease);z-index:2}
.app .ok svg{width:8px;height:8px;stroke-width:3.5}
.app.done .ok,.app.on .ok{transform:scale(1)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- focus: the active tool grows, the rest steps back ---------- */
.grp.fo{z-index:40;border-color:var(--cyan);box-shadow:0 0 0 6px rgba(0,174,239,.14),0 24px 50px rgba(6,42,91,.22);transform:translate(-50%,-50%) translate(var(--fx,0px),var(--fy,0px)) scale(var(--fs,1.5))}
.grp.fo h6{color:#036b95}
.grp.fo .app.fa .mn{width:36px;height:36px;border-radius:10px;font-size:12px}
.grp.fo .app.fa .nm{font-size:12.5px}
.grp.fo{background:#fff}
.grp.fo .app:not(.fa){opacity:1}.grp.fo .app:not(.fa) .mn{filter:grayscale(.85);opacity:.55}.grp.fo .app:not(.fa) .nm,.grp.fo .app:not(.fa) .sb,.grp.fo .app:not(.fa) .bd{opacity:.45}
#app[data-theme=dark] .grp.fo{background:#1b1d21}
.stage.focusing .grp:not(.fo){filter:grayscale(var(--gs,1)) blur(var(--bl,0px));opacity:var(--op,.35)}
.stage.focusing .veil{opacity:var(--veil,0)}
.stage.focusing #orb{opacity:var(--orbop,1)}
/* dock variant: big spotlight card under the orb */
#app[data-focus=dock] .now.has{width:400px;padding:14px 16px}
#app[data-focus=dock] .now.has .lgo .mn{width:56px;height:56px;border-radius:14px;font-size:17px}
#app[data-focus=dock] .now.has .t{font-size:15px}

/* ---------- workpad (bigger: inner layout scaled up) ---------- */
.work{position:absolute;left:864px;top:146px;width:720px;height:778px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-2);overflow:hidden}
.work-in{position:absolute;left:0;top:0;width:610px;height:659px;transform:scale(1.1803);transform-origin:0 0;display:flex;flex-direction:column}
.tabs{display:flex;align-items:flex-end;gap:2px;height:38px;padding:6px 8px 0;background:#eef2f7;border-bottom:1px solid var(--line);overflow:hidden;flex:none}
.tabs .dots{display:flex;gap:5px;align-self:center;margin:0 8px 6px 4px;flex:none}
.tabs .dots i{width:9px;height:9px;border-radius:50%;background:#d3dce8}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:9px 9px 0 0;font-size:11px;font-weight:600;color:var(--muted);flex:0 1 112px;min-width:32px;overflow:hidden;white-space:nowrap;animation:tabIn .35s var(--ease) both;cursor:pointer}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:#e5ebf3}
.tab.on{background:#fff;color:var(--ink);flex:0 0 auto;box-shadow:0 -1px 0 var(--line)}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.abar{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.abar .tt{font-size:13px;font-weight:700}
.abar .tt small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.act{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 10px var(--mono);color:#036b95;background:var(--cyan-soft);border:1px solid var(--cyan-line);padding:3px 8px;border-radius:999px;white-space:nowrap}
.act i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:blink .9s infinite}
.act.wr{color:var(--violet);background:var(--violet-soft);border-color:#e0dbff}.act.wr i{background:var(--violet)}
.act.ok{color:var(--ok-d);background:var(--ok-soft);border-color:#c5efd8}.act.ok i{background:var(--ok);animation:none}
.act.idle{color:var(--faint);background:var(--bg);border-color:var(--line)}.act.idle i{background:var(--faint);animation:none}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;padding:12px 14px;overflow:hidden;display:none}
.view.on{display:block;animation:vIn .35s var(--ease)}
@keyframes vIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:12.5px}
.empty div{display:grid;gap:10px;justify-items:center}
.empty .mk{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#bfeaff 40%,#cfe0ff 75%,transparent 76%);opacity:.8}
.vh{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:2px 0 8px}
.vh .sp{flex:1}
.vh .n{font:600 10px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-2)}

/* mail */
.ml-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;border:1px solid transparent}
.avt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.ml-row .f{font-size:12px;font-weight:600}
.ml-row .sj{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-row .tm{font:500 10px var(--mono);color:var(--faint)}
.ml-row.unread .f,.ml-row.unread .sj{color:var(--ink);font-weight:700}
.ml-row.sel{background:var(--cyan-soft);border-color:var(--cyan-line)}
.ml-row .lb{font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.mail{display:grid;gap:10px}
.mail .subj{font-size:16px;font-weight:700;line-height:1.3}
.mail .frm{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mail .frm .avt{width:34px;height:34px;font-size:11px}
.mail .frm b{font-size:12.5px}.mail .frm span{display:block;font-size:11px;color:var(--muted)}
.mail .frm .tm{margin-left:auto;font:500 10.5px var(--mono);color:var(--faint)}
.mail .body{font-size:13px;line-height:2.25;color:var(--ink-2)}
.mail .body p+p{margin-top:4px}
.hl{border-radius:4px;padding:1px 2px;transition:background .4s,box-shadow .4s;position:relative}
.hl::after{content:attr(data-tag);position:absolute;left:0;top:-15px;font:700 8px Inter;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:4px;white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s}
.hl.on::after{opacity:1;transform:none}
.hl.c-del.on{background:rgba(0,174,239,.16);box-shadow:0 0 0 1.5px rgba(0,174,239,.45)}.hl.c-del::after{background:var(--cyan);color:#fff}
.hl.c-per.on{background:rgba(91,75,214,.13);box-shadow:0 0 0 1.5px rgba(91,75,214,.4)}.hl.c-per::after{background:var(--violet);color:#fff}
.hl.c-aud.on{background:rgba(18,183,106,.14);box-shadow:0 0 0 1.5px rgba(18,183,106,.45)}.hl.c-aud::after{background:var(--ok);color:#fff}
.hl.c-due.on{background:rgba(245,158,11,.18);box-shadow:0 0 0 1.5px rgba(181,71,8,.4)}.hl.c-due::after{background:var(--warn);color:#fff}
.hl.c-sec.on{background:rgba(11,59,122,.08);box-shadow:0 0 0 1.5px rgba(11,59,122,.3)}.hl.c-sec::after{background:var(--navy);color:#fff}
.ol-bar{height:6px;border-radius:4px;background:linear-gradient(90deg,#0f6cbd,#2b88d8);margin:-2px 0 12px}
.parsed{margin-top:8px;border:1px dashed var(--cyan-line);background:#f7fcff;border-radius:12px;padding:9px 12px;display:none;gap:5px;font:500 10.5px var(--mono);color:var(--ink-2)}
.parsed.on{display:grid;animation:pop .4s var(--ease) both}
.parsed b{color:#036b95;font-weight:600}
.note{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:11px;color:var(--ink-2);margin-top:8px}
.note svg{width:14px;height:14px;color:var(--muted)}
/* whatsapp */
.wa{position:absolute;inset:0;background:#efeae2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px);background-size:14px 14px;display:flex;flex-direction:column}
.wa-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f0f2f5;border-bottom:1px solid #e3e6ea}
.wa-h .avt{width:32px;height:32px;background:#0b3b7a;font-size:11px}
.wa-h b{font-size:12.5px}.wa-h span{display:block;font-size:10.5px;color:var(--muted)}
.wa-b{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.bub{max-width:80%;padding:7px 10px 5px;border-radius:9px;font-size:12.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:pop .35s var(--ease) both;position:relative}
.bub .tm{display:block;text-align:right;font-size:9.5px;color:#7a8794;margin-top:2px}
.bub.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.bub.out{background:#d9fdd3;align-self:flex-end;border-top-right-radius:2px}
.typing{align-self:flex-start;background:#fff;border-radius:9px;padding:9px 12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#b6bec7;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.wa-in{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f0f2f5}
.wa-in div{flex:1;height:32px;border-radius:9px;background:#fff;font-size:12px;color:var(--faint);display:flex;align-items:center;padding:0 12px}
/* vault */
.vault-top{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fafbfd}
.vault-top b{font-size:13px}.vault-top span{display:block;font-size:11px;color:var(--muted)}
.scopebox{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.pill{font:500 10px var(--mono);padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.c{background:var(--cyan-soft);border-color:var(--cyan-line);color:#036b95}
.pill.v{background:var(--violet-soft);border-color:#e0dbff;color:var(--violet)}
.pill.g{background:var(--ok-soft);border-color:#c5efd8;color:var(--ok-d)}
.pill.w{background:var(--warn-soft);border-color:#fbd9a8;color:var(--warn)}
.passkey{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;border:1px solid var(--cyan-line);background:#f5fbfe;margin-bottom:8px}
.passkey .fp{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--cyan-line);color:var(--cyan);position:relative}
.passkey .fp svg{width:19px;height:19px}
.passkey .fp::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--cyan);opacity:.6;animation:ping 1.2s ease-out infinite}
.passkey.ok{border-color:#c5efd8;background:var(--ok-soft)}
.passkey.ok .fp{color:var(--ok);border-color:#c5efd8}.passkey.ok .fp::after{display:none}
.passkey b{font-size:12.5px}.passkey span{display:block;font-size:11px;color:var(--muted)}
@keyframes ping{from{transform:scale(.8);opacity:.7}to{transform:scale(1.35);opacity:0}}
#creds{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.cred{display:grid;grid-template-columns:22px 1fr auto 16px;gap:8px;align-items:center;padding:4px 4px;border-bottom:1px solid #f0f3f7;font-size:11px}
.cred .a{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cred .a small{display:block;font:500 9px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.cred .lk{color:var(--faint)}.cred .lk svg{width:13px;height:13px}
.cred.open .lk{color:var(--ok)}
.cred.open{background:linear-gradient(90deg,rgba(18,183,106,.07),transparent)}
/* tables / streams */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff}
.kpi .l{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font:600 14px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v.g{color:var(--ok-d)}.kpi .v.r{color:#b42318}
.stages{display:grid;gap:6px;margin-bottom:10px}
.stg{display:grid;grid-template-columns:130px 1fr 100px;gap:10px;align-items:center;font-size:11.5px;font-weight:600}
.stg .tr{height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.stg .tr i{display:block;height:100%;width:0;border-radius:5px;transition:width 1s var(--ease)}
.stg .n{font:600 11px var(--mono);text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);background:#fafbfd}
.tbl td{padding:5px 6px;border-bottom:1px solid #f0f3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.m{font-family:var(--mono);font-size:10px}
.tbl tr.new{animation:rowIn .3s var(--ease) both}
.tbl tr.exc td{background:#fffaf2}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px);background:#f0fbff}to{opacity:1;transform:none}}
.ty{font:600 9px var(--mono);padding:1px 5px;border-radius:5px;display:inline-block}
.ty.inv{background:#eef4ff;color:#2a4fa8}.ty.pay{background:var(--ok-soft);color:var(--ok-d)}.ty.sub{background:var(--cyan-soft);color:#036b95}.ty.cr{background:var(--violet-soft);color:var(--violet)}.ty.rf{background:#fdecec;color:#b42318}
.mt{font:600 9.5px var(--mono);color:var(--ok-d)}
.mt.w{color:var(--warn)}
.streambox{border:1px solid var(--line);border-radius:12px;overflow:hidden;height:300px;position:relative}
.streambox::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,#fff);pointer-events:none}
.scanline{position:absolute;left:0;right:0;height:26px;top:24px;background:linear-gradient(180deg,rgba(0,174,239,0),rgba(0,174,239,.10),rgba(0,174,239,0));animation:scan 1.2s linear infinite;pointer-events:none;z-index:2}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(250px)}}
.sl{display:inline-flex;align-items:center;gap:3px;font:600 8.5px var(--mono);padding:1px 5px 1px 2px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
/* trace (back-and-forth reconciliation) */
.match{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch;gap:0;margin-bottom:8px}
.rec{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;min-height:168px;transition:border-color .4s,box-shadow .4s,background .4s;position:relative;overflow:hidden}
.rec.live{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,174,239,.10)}
.rec .rh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.rec .rh b{font-size:12.5px;display:block}.rec .rh small{font:500 10px var(--mono);color:var(--faint)}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11px}
.rec dt{color:var(--faint);font-weight:500}.rec dd{font:600 10.5px var(--mono);text-align:right;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .seek{display:grid;gap:7px;margin-top:6px}
.rec .seek i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#eef2f7 0%,#f7f9fc 50%,#eef2f7 100%);background-size:200% 100%;animation:shim 1.1s linear infinite}
.rec .seekt{font:500 10.5px var(--mono);color:#036b95;display:flex;align-items:center;gap:6px}
.rec .seekt svg{width:13px;height:13px;animation:spin 1s linear infinite}
.rec.none dd{color:var(--warn)}
.rec .thumb{position:absolute;right:10px;top:10px;width:46px;height:58px;border-radius:4px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transform:rotate(4deg);padding:6px 5px;display:flex;flex-direction:column;gap:3px}
.rec .thumb i{height:3px;border-radius:2px;background:#d5dbe4}.rec .thumb i:first-child{background:#8a97a8;width:70%}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.mid::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--line-2)}
.mid.ok::before{border-color:#9ee0bf;border-top-style:solid}.mid.warn::before{border-color:#fbd9a8}
.mid .ms{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--cyan-line);display:grid;place-items:center;color:var(--cyan);position:relative;z-index:1}
.mid .ms svg{width:16px;height:16px}
.mid.seek .ms svg{animation:spin 1s linear infinite}
.mid.ok .ms{border-color:var(--ok);color:#fff;background:var(--ok)}
.mid.warn .ms{border-color:#f5a524;color:#fff;background:#f5a524}
.mid small{font:600 8.5px var(--mono);color:var(--faint);text-align:center;background:#fff;position:relative;z-index:1;padding:0 2px;line-height:1.3}
.mid .pk{position:absolute;top:calc(50% - 3px);left:0;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:hop 1s linear infinite;opacity:0}
.mid.seek .pk{opacity:1}
@keyframes hop{from{left:0}to{left:calc(100% - 6px)}}
.verdict{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:10px;min-height:38px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.verdict svg{width:16px;height:16px}
.verdict.ok{background:var(--ok-soft);border-color:#c5efd8;color:var(--ok-d)}
.verdict.warn{background:var(--warn-soft);border-color:#fbd9a8;color:var(--warn)}
.trail{display:grid;gap:5px}
.tr-i{display:grid;grid-template-columns:auto 14px auto 1fr auto;gap:7px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;font-size:11px;animation:rowIn .35s var(--ease) both;background:#fff}
.tr-i .ar{color:var(--faint);font-size:11px;text-align:center}
.tr-i .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
/* waterfall */
.wf{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;height:160px;padding:10px 6px 0;border-bottom:1px solid var(--line);margin-bottom:6px;position:relative}
.wf .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.wf .c i{display:block;width:58%;border-radius:5px;height:0;transition:height .9s var(--ease)}
.wf .c b{font:600 11px var(--mono);margin-bottom:4px;opacity:0;transition:opacity .4s}
.wf .c.on b{opacity:1}
.wfl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:10px;color:var(--muted);text-align:center;font-weight:600;padding:0 6px}
.ring-k{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-top:10px}
.ring-k svg.rk{width:48px;height:48px;transform:rotate(-90deg)}
.ring-k circle{fill:none;stroke-width:6}
.ring-k b{font:700 18px var(--mono)}.ring-k span{display:block;font-size:11px;color:var(--muted)}
.bk{display:grid;gap:7px;margin-top:8px}
.bkr{display:grid;grid-template-columns:150px 1fr 66px;gap:10px;align-items:center;font-size:11px;font-weight:600}
.bkr .tr{height:16px;border-radius:5px;background:var(--bg);overflow:hidden;display:flex}
.bkr .tr i{display:block;height:100%;transition:width .6s var(--ease)}
.bkr .n{font:600 11px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.srcs{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.burn{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;margin-top:12px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fafbfd}
.burn .b{text-align:center}
.burn .b .l{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.burn .b .v{font:700 15px var(--mono);margin-top:3px}
.burn .op{font:600 14px var(--mono);color:var(--faint)}
.runway{display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px 12px;border-radius:12px;background:linear-gradient(90deg,#062a5b,#0b3b7a);color:#fff}
.runway .v{font:700 26px var(--mono)}
.runway span{font-size:11.5px;opacity:.85;line-height:1.4}
.rw-bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
.rw-bar i{display:block;height:100%;width:0;background:var(--cyan);transition:width 1.4s var(--ease)}
/* word doc */
.office{position:absolute;inset:0;background:#e9edf2;display:flex;flex-direction:column}
.ribbon{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.ribbon .r{display:flex;gap:4px}
.ribbon .r i{width:18px;height:14px;border-radius:3px;background:#eef1f5}
.seg{margin-left:auto;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.page-w{flex:1;overflow:auto;padding:12px 0;display:flex;justify-content:center;position:relative;scrollbar-width:none}
.page-w::-webkit-scrollbar{display:none}
.page-w .page{zoom:.86}
.page{width:500px;background:#fff;box-shadow:0 2px 10px rgba(11,31,51,.12);border-radius:3px;padding:24px 28px;font-size:10.5px;color:var(--ink-2);line-height:1.5;position:relative;flex:none;height:max-content}
.page .co-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:11px;color:var(--ink);letter-spacing:.04em}
.page .co-h .av{width:18px;height:18px;border-radius:5px;background:#0b1f33;color:#fff;display:grid;place-items:center;font-size:9px}
.page h1{font-size:19px;color:var(--ink);letter-spacing:-.01em;margin-top:10px;line-height:1.2}
.page .sub{font-size:10px;color:var(--muted);margin-top:3px}
.page h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dk>div{border:1px solid var(--line);border-radius:7px;padding:6px 7px}
.dk .l{font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.dk .v{font:700 13px var(--mono);color:var(--ink);margin-top:2px}
.dk .d{font-size:8.5px;color:var(--ok-d);font-weight:600}
.skl{display:grid;gap:5px}.skl i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,#eef2f7 0%,#f7f9fc 50%,#eef2f7 100%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.fill{display:none}.blk.f .skl{display:none}.blk.f .fill{display:block;animation:pop .45s var(--ease) both}
.chart{display:flex;align-items:flex-end;gap:14px;height:84px;padding:0 6px;border-bottom:1px solid var(--line)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font:600 8.5px var(--mono);color:var(--ink-2)}
.chart div i{display:block;width:70%;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#00aeef,#0b3b7a);height:0;transition:height .9s var(--ease)}
.chart-l{display:flex;gap:14px;padding:3px 6px 0;font-size:8.5px;color:var(--faint);text-align:center}.chart-l span{flex:1}
.page ul{padding-left:14px}.page li{margin:2px 0}
.src{display:none;align-items:center;gap:3px;font:600 7.5px var(--mono);padding:0 4px;border-radius:4px;background:var(--cyan-soft);color:#036b95;border:1px solid var(--cyan-line);vertical-align:1px;margin-left:3px;white-space:nowrap}
.page.internal .src{display:inline-flex}
.dk .src{display:none;margin:3px 0 0}.page.internal .dk .src{display:flex;width:max-content}
.ext-tag{position:absolute;right:16px;top:16px;font:600 9px var(--mono);padding:2px 7px;border-radius:5px;background:var(--ok-soft);color:var(--ok-d);border:1px solid #c5efd8;z-index:2}
.ext-tag.int{background:var(--cyan-soft);color:#036b95;border-color:var(--cyan-line)}
.files{display:flex;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid var(--line)}
.file{display:none;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:10px;border:1px solid var(--line);font-size:10.5px;font-weight:600;animation:pop .4s var(--ease) both}
.file.on{display:flex}
.file small{display:block;font:500 9px var(--mono);color:var(--muted)}
.file .fi{width:24px;height:28px;border-radius:4px;display:grid;place-items:center;color:#fff;font:700 7.5px var(--mono)}
/* excel */
.xl{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.xl-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#107c41;color:#fff;font-size:11px;font-weight:600}
.fx{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);font:500 10.5px var(--mono);color:var(--ink-2)}
.fx b{font-family:Inter;font-style:italic;color:var(--muted);font-weight:600}
.fx .cell{width:42px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;text-align:center}
.grid{flex:1;overflow:hidden;display:grid;grid-template-columns:30px 170px repeat(4,1fr);grid-auto-rows:25px;font-size:10.5px;align-content:start}
.grid div{border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.grid .hd{background:#f3f5f8;color:var(--faint);font:600 9.5px var(--mono);justify-content:center}
.grid .c{font-family:var(--mono);font-size:10px;justify-content:flex-end;transition:background .4s}
.grid .c.t{font-family:Inter;justify-content:flex-start;font-weight:600}
.grid .c.n{animation:cellIn .5s var(--ease)}
.grid .c.sel{box-shadow:inset 0 0 0 2px #107c41}
@keyframes cellIn{from{background:#c9efd8}to{background:#fff}}
.sheets{display:flex;gap:2px;padding:4px 8px;background:#f3f5f8;border-top:1px solid var(--line)}
.sheets span{font-size:10.5px;padding:3px 10px;border-radius:5px;color:var(--muted);animation:pop .3s var(--ease) both}
.sheets span.on{background:#fff;color:#107c41;font-weight:700;box-shadow:var(--sh-1)}
/* docusign */
.ds{position:absolute;inset:0;background:#f1f2f6;display:flex;flex-direction:column}
.ds-h{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
.ds-h b{font-size:12.5px}.ds-h span{display:block;font-size:10.5px;color:var(--muted)}
.ds-h .btn{margin-left:auto;font-size:11px;font-weight:700;padding:6px 12px;border-radius:7px;background:#fdd85d;color:#3d2c00;border:0}
.deleg{margin:8px 14px 0;display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:10px;background:var(--violet-soft);border:1px solid #e0dbff;font-size:10.5px;color:#3b2fa0;line-height:1.35}
.deleg svg{width:15px;height:15px}
.ds-p{flex:1;display:flex;justify-content:center;padding:10px 0 0;position:relative;overflow:hidden}
.ds-p .page{width:440px;padding:20px 24px;height:380px}
.sigbox{margin-top:12px;border:1.5px dashed #c7cfdb;border-radius:8px;height:70px;position:relative;background:#fffdf3;transition:border-color .4s,background .4s}
.sigbox .tag{position:absolute;left:-1px;top:-11px;font:700 8.5px Inter;letter-spacing:.06em;text-transform:uppercase;background:#fdd85d;color:#3d2c00;padding:2px 7px;border-radius:4px}
.sigbox svg{position:absolute;left:12px;top:6px;width:240px;height:60px}
.sigbox text{font-family:Caveat,'Segoe Script','Snell Roundhand','Brush Script MT',cursive;font-size:38px;font-weight:600;fill:transparent;stroke:#0b2a6b;stroke-width:1.1;stroke-dasharray:900;stroke-dashoffset:900}
.sigbox.go text{animation:sign 1.8s ease forwards}
.sigbox.go{border-style:solid;border-color:#c5efd8;background:#fbfffc}
@keyframes sign{75%{stroke-dashoffset:0;fill:transparent}100%{stroke-dashoffset:0;fill:#0b2a6b}}
.sigbox .who{position:absolute;right:10px;bottom:6px;font:500 9px var(--mono);color:var(--muted);text-align:right}
.stamp{position:absolute;right:70px;top:300px;transform:rotate(-12deg) scale(1.6);opacity:0;border:3px solid var(--ok);color:var(--ok);font:800 15px Inter;letter-spacing:.12em;padding:4px 12px;border-radius:8px;transition:all .45s var(--ease);background:rgba(255,255,255,.7)}
.stamp.on{opacity:1;transform:rotate(-12deg) scale(1)}
.audit{margin:0 14px 10px;padding:7px 11px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;gap:3px;font:500 9.5px var(--mono);color:var(--ink-2)}
.audit div{display:none}.audit div.on{display:block;animation:lnIn .3s both}
.audit b{color:var(--ok-d);font-weight:600}
/* compose */
.cmp{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp .h{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f2f6fc;font-size:12px;font-weight:600}
.cmp .row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #f0f3f7;font-size:11.5px;min-height:34px;flex-wrap:wrap}
.cmp .row>span:first-child{color:var(--faint);width:46px;flex:none}
.rcp{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:11px;animation:pop .3s var(--ease) both}
.rcp i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;font-style:normal}
.cmp .bd{padding:10px 12px;font-size:12px;line-height:1.6;color:var(--ink-2);min-height:150px;white-space:pre-wrap}
.cmp .att{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.cmp .ft{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.send{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:999px;background:#0b57d0;color:#fff;font-size:12px;font-weight:700;border:0;transition:transform .2s}
.send.pressed{transform:scale(.94)}
.send svg{width:14px;height:14px}
.sent{display:none;align-items:center;gap:10px;margin-top:10px;padding:10px 13px;border-radius:12px;background:var(--ok-soft);border:1px solid #c5efd8;color:var(--ok-d);font-size:12px;font-weight:600}
.sent.on{display:flex;animation:pop .4s var(--ease) both}
.sent svg{width:18px;height:18px}
.caret::after{content:"▍";color:var(--cyan);animation:blink 1s steps(1) infinite}
/* approval overlay */
.ov{position:absolute;inset:0;z-index:60;background:rgba(244,247,251,.66);backdrop-filter:blur(3px);display:none;place-items:center}
.ov.on{display:grid;animation:vIn .35s var(--ease)}
.apv{width:470px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(6,42,91,.25);padding:18px 20px 16px;color:var(--ink)}
.apv .top{display:flex;align-items:center;gap:10px}
.apv .top .av{width:38px;height:38px;border-radius:50%;background:#c8d6ea;color:var(--navy-d);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.apv .top b{font-size:15px}.apv .top span{display:block;font-size:11.5px;color:var(--muted)}
.apv .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 10px}
.apv .grid4 div{border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.apv .grid4 .l{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.apv .grid4 .v{font:700 13.5px var(--mono);margin-top:2px}
.apv .ln{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:5px 0;border-top:1px solid #f0f3f7}
.apv .ln svg{width:14px;height:14px;color:var(--muted)}
.apv .ln b{font-weight:600}
.apv .btns{display:flex;gap:8px;margin-top:12px}
.apv .btns button{flex:1;height:40px;border-radius:11px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:7px}
.apv .btns button svg{width:15px;height:15px}
.apv .btns .pri{background:var(--navy-d);color:#fff;border-color:var(--navy-d);position:relative;overflow:hidden}
.apv .btns .pri .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan);width:0}
.apv .hint{font:500 10px var(--mono);color:var(--faint);text-align:center;margin-top:8px}
.apv.editing .hint{color:var(--violet)}
.page[contenteditable=true]{outline:2px dashed #b9b0f5;outline-offset:4px}
/* fliers + cursor */
.flyer{position:absolute;z-index:200;pointer-events:none;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:#fff;border:1px solid var(--cyan-line);color:#036b95;box-shadow:var(--sh-2);white-space:nowrap;transition:left .75s var(--ease),top .75s var(--ease),opacity .3s,transform .75s var(--ease)}
#cursor{position:absolute;z-index:220;left:1300px;top:600px;pointer-events:none;transition:left .7s var(--ease),top .7s var(--ease),opacity .3s;opacity:0;display:flex;align-items:flex-start;gap:2px}
#cursor svg{width:18px;height:18px;fill:var(--navy-d);stroke:#fff;stroke-width:1.5}
#cursor span{font:700 9px Inter;background:var(--navy-d);color:#fff;padding:2px 6px;border-radius:5px;margin-top:12px}
#cursor.on{opacity:1}
#cursor .rp{position:absolute;left:-8px;top:-8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--cyan);opacity:0}
#cursor.click .rp{animation:rp .5s ease-out}
@keyframes rp{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2)}}
.foot{position:absolute;left:16px;bottom:2px;font:500 9.5px var(--mono);color:var(--faint)}

/* ---------- dark theme (matches the pitch slides) ---------- */
#app[data-theme=dark]{--bg:#111214;--line:rgba(255,255,255,.1);--line-2:rgba(255,255,255,.16);background:radial-gradient(1200px 800px at 30% 50%,#1f2125,#121315 70%)}
#app[data-theme=dark] .logo b,#app[data-theme=dark] .clock b,#app[data-theme=dark] .phase-t h2,#app[data-theme=dark] .bf .v,#app[data-theme=dark] .app .nm,#app[data-theme=dark] .now .t{color:#fff}
#app[data-theme=dark] .logo small,#app[data-theme=dark] .clock,#app[data-theme=dark] .phase-t p,#app[data-theme=dark] .bf .s,#app[data-theme=dark] .app .sb,#app[data-theme=dark] .now .w,#app[data-theme=dark] .legend div,#app[data-theme=dark] .ticker{color:rgba(255,255,255,.55)}
#app[data-theme=dark] .ticker .ln b{color:#fff}
#app[data-theme=dark] .logo .mk{box-shadow:0 0 0 3px #1b1d21,0 0 0 4px rgba(255,255,255,.1),0 4px 18px rgba(0,174,239,.5)}
#app[data-theme=dark] .co,#app[data-theme=dark] .rail,#app[data-theme=dark] .ctrl button,#app[data-theme=dark] .bf,#app[data-theme=dark] .grp,#app[data-theme=dark] .sec{background:#1b1d21;color:#fff}
#app[data-theme=dark] .co span,#app[data-theme=dark] .sec{color:rgba(255,255,255,.6)}
#app[data-theme=dark] .ctrl button{color:rgba(255,255,255,.75)}
#app[data-theme=dark] .rail button.cur{background:#fff;color:#111}
#app[data-theme=dark] .rail button.cur .n{background:#111;color:#fff;border-color:#111}
#app[data-theme=dark] .rail button.done{color:rgba(255,255,255,.8)}
#app[data-theme=dark] .rail button .n{background:#26282d}
#app[data-theme=dark] .runbtn:hover,#app[data-theme=dark] .runbtn.on{background:#1b1d21;color:#fff}
#app[data-theme=dark] .stage{background:#16171a;box-shadow:none}
#app[data-theme=dark] .stage::before{background:radial-gradient(420px 360px at 418px 330px,rgba(0,174,239,.14),transparent 70%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/18px 18px}
#app[data-theme=dark] .ring{border-color:rgba(255,255,255,.08)}#app[data-theme=dark] .ring.r2{border-color:rgba(255,255,255,.05)}
#app[data-theme=dark] .now{background:rgba(27,29,33,.96)}
#app[data-theme=dark] .veil{background:rgba(17,18,20,.45)}
#app[data-theme=dark] .bf .ph{background:linear-gradient(90deg,#25272c 0%,#2e3036 50%,#25272c 100%);background-size:200% 100%}
#app[data-theme=dark] .app.auth{background:rgba(0,174,239,.08)}
#app[data-theme=dark] .app.active,#app[data-theme=dark] .app.write{background:rgba(0,174,239,.12)}
#app[data-theme=dark] .app.write{background:rgba(91,75,214,.2)}
#app[data-theme=dark] .app .ok{box-shadow:0 0 0 2px #1b1d21}
#app[data-theme=dark] #links path.idle{stroke:rgba(255,255,255,.12)}
#app[data-theme=dark] .work{border-color:rgba(255,255,255,.12)}
#app[data-theme=dark] .tabs{background:#1b1d21;border-color:rgba(255,255,255,.08)}
#app[data-theme=dark] .tab{color:rgba(255,255,255,.55)}#app[data-theme=dark] .tab:hover{background:#25272c}
#app[data-theme=dark] .tab.on{background:#fff;color:var(--ink)}
#app[data-theme=dark] .work-in{--line:#e3e9f1;--line-2:#d3dce8;--bg:#f4f7fb}
#app[data-theme=dark] .runp{--line:#e3e9f1;--line-2:#d3dce8;--bg:#f4f7fb}
#app[data-theme=dark] .foot{color:rgba(255,255,255,.3)}
#app[data-theme=dark] .ov{background:rgba(17,18,20,.6)}
#app[data-theme=dark] .apv{--line:#e3e9f1}
</style></head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo"><span class="mk"></span><div><b>WATARI</b><small>CFO agent</small></div></div>
    <div class="co"><span class="av">F</span>Fennic <span>· Seed</span></div>
    <span class="sp"></span>
    <div class="rail" id="rail"></div>
    <span class="sp"></span>
    <button class="runbtn" id="runbtn" title="Run information: sources, rows, reconciliation, time"></button>
    <div class="clock" id="clock"></div>
    <div class="ctrl"><button id="bPlay" title="Play / pause (space)"></button><button id="bNext" title="Next phase (→)"></button><button id="bRe" title="Restart (R)"></button><button id="bSpd" title="Speed">1×</button></div>
  </div>
  <div class="runp" id="runp"></div>

  <div class="brief">
    <div class="bf k-req" id="f-req"><div class="l"></div><div class="v"></div><div class="s"></div></div>
    <div class="bf k-period" id="f-period"><div class="l"></div><div class="v"></div><div class="s"></div></div>
    <div class="bf k-aud" id="f-aud"><div class="l"></div><div class="v"></div><div class="s"></div></div>
    <div class="bf k-del" id="f-del"><div class="l"></div><div class="v"></div><div class="s"></div></div>
    <div class="bf k-due" id="f-due"><div class="l"></div><div class="v"></div><div class="s"></div></div>
  </div>

  <section class="stage" id="stage">
    <div id="world">
      <div class="ring"></div><div class="ring r2"></div>
      <div class="veil"></div>
      <svg id="links"><g id="lk"></g><g id="pk"></g></svg>
      <canvas id="orb"></canvas>
    </div>
    <div class="mood"><span class="chip" id="mood"></span></div>
    <div class="now" id="now"><div class="lgo"></div><div class="t"></div><div class="w"></div><div class="pg"><i></i></div></div>
    <div class="phase-t" id="phaseT"></div>
    <div class="legend">
      <div>Reading<svg viewBox="0 0 26 6"><line x1="0" y1="3" x2="26" y2="3" stroke="#00aeef" stroke-width="2" stroke-dasharray="3 5"/></svg></div>
      <div>Writing / acting<svg viewBox="0 0 26 6"><line x1="0" y1="3" x2="26" y2="3" stroke="#062a5b" stroke-width="2" stroke-dasharray="6 5"/></svg></div>
      <div>Done<svg viewBox="0 0 26 6"><line x1="0" y1="3" x2="26" y2="3" stroke="#9ee0bf" stroke-width="2"/></svg></div>
    </div>
    <div class="ticker" id="ticker"><div class="h"><i></i>Execution log</div></div>
    <div class="secs"><div class="h">Report sections</div><div class="wrap" id="secs"></div></div>
    <div class="ov" id="ov"></div>
  </section>

  <section class="work"><div class="work-in">
    <div class="tabs" id="tabs"><span class="dots"><i></i><i></i><i></i></span></div>
    <div class="abar" id="abar"></div>
    <div class="views" id="views"><div class="empty" id="empty"><div><span class="mk"></span>The agent's screen.<br>Apps open here as WATARI uses them.</div></div></div>
  </div></section>
  <div id="cursor"><span class="rp"></span><svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z"/></svg><span>WATARI</span></div>
</div>

   Vaultly is a fictional vault, so it ships with its own original mark. */
const LOGO={};
LOGO.vault='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#g)"/><path d="M32 12l16 6v12c0 10.5-6.8 18.6-16 22-9.2-3.4-16-11.5-16-22V18z" fill="#fff" opacity=".95"/><circle cx="32" cy="30" r="5.5" fill="#1e3a8a"/><path d="M29.6 33.5h4.8l1.6 9h-8z" fill="#1e3a8a"/></svg>`);
function mn(id,cls=''){const A=APPS[id];const L=LOGO[id];return `<span class="mn ${cls} ${L?'img':''}" data-a="${id}" style="--c:${A.c}">${L?`<img src="${L}" alt="${A.n}">`:A.mono}</span>`;}
function refreshLogos(){$$('.mn[data-a]').forEach(e=>{const id=e.dataset.a;if(LOGO[id]&&!e.classList.contains('img')){e.classList.add('img');e.innerHTML=`<img src="${LOGO[id]}" alt="${APPS[id].n}">`;}});if($('#runp').classList.contains('on'))renderRun();}
function loadLogos(){Object.keys(APPS).forEach(id=>{let st=null;try{st=localStorage.getItem('watari-logo-'+id);}catch(e){}
  if(st){LOGO[id]=st;return;}
  const fs=LOGO_FILES.filter(f=>f.replace(/\.[a-z]+$/i,'')===id);if(!fs.length)return;
  const tryF=(fs)=>{if(!fs.length)return;const im=new Image();im.onload=()=>{LOGO[id]=fs[0];refreshLogos();};im.onerror=()=>tryF(fs.slice(1));im.src=fs[0];};
  tryF(fs.map(f=>'logos/'+f));});refreshLogos();}
/* logos/logos.json lists the files present in logos/ (e.g. ["gmail.svg","stripe.png"]); no blind probing, so no 404 noise */
let LOGO_FILES=[];
function initLogos(){fetch('logos/logos.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[]).then(a=>{LOGO_FILES=Array.isArray(a)?a.filter(f=>typeof f==='string'&&/^[a-z0-9_-]+\.(svg|png|jpg|webp)$/i.test(f)):[];loadLogos();});}

  const id=t.dataset.a||(t.id||'').replace(/^a-/,'')||t.dataset.slot;if(!APPS[id])return;const r=new FileReader();r.onload=()=>{LOGO[id]=r.result;try{localStorage.setItem('watari-logo-'+id,r.result);}catch(er){}

let IDLE=false,GEN=0,PAUSED=false,INSTANT=false,SPEED=1,CUR=0,ENDED=false,AGENT_MS=0,REPORTED=false,RECON='–';
const T0=Date.UTC(2026,9,16,9,12,0);
function wait(ms){AGENT_MS+=ms*4.4;tickTime();return new Promise(res=>{if(INSTANT)return res();const g=GEN;let left=ms/SPEED,last=performance.now();
  (function t(now){if(g!==GEN)return;if(!PAUSED)left-=now-last;last=now;if(left<=0)res();else requestAnimationFrame(t);})(last);});}
function tickTime(){const d=new Date(T0+AGENT_MS);$('#clock').innerHTML=`<b>Fri 16 Oct 2026</b><br>${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} CET`;
  const e=$('#rm-time');if(e)e.textContent=agentTime();}
const agentTime=()=>{const s=Math.floor(AGENT_MS/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const alive=g=>g===GEN;
function rel(el,to=APP){const r=el.getBoundingClientRect(),a=to.getBoundingClientRect();return{x:(r.left-a.left)/SCALE,y:(r.top-a.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE};}
function anim(el,from,to,ms,fmt){if(!el)return;if(INSTANT){el.textContent=fmt(to);return;}const t0=performance.now();(function f(n){const q=Math.min(1,(n-t0)/(ms/SPEED));const e=1-Math.pow(1-q,3);el.textContent=fmt(from+(to-from)*e);if(q<1)requestAnimationFrame(f);})(t0);}
async function type(el,text,cps=55){if(INSTANT){el.textContent=text;return;}el.classList.add('caret');el.textContent='';const g=GEN;for(let i=0;i<text.length;i+=2){if(!alive(g))return;el.textContent=text.slice(0,i+2);await wait(2000/cps);}el.classList.remove('caret');}

/* ---------- orb ---------- */
const cv=$('#orb'),cx=cv.getContext('2d');const DPR=2,OS=260;cv.width=OS*DPR;cv.height=OS*DPR;
const NP=520,PTS=[];for(let i=0;i<NP;i++){const y=1-(i+.5)/NP*2,r=Math.sqrt(1-y*y),th=i*2.399963;PTS.push([Math.cos(th)*r,y,Math.sin(th)*r,.5+((i*7919)%100)/100*.85,(i*104729)%11===0]);}
const ORB={rot:0,energy:.2,target:.2,pulse:0};
function orbPulse(v=.6){ORB.pulse=Math.min(1.4,ORB.pulse+v);}
const DARK=VARIANT.theme==='dark';
function drawOrb(){cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,OS,OS);ORB.energy+=(ORB.target-ORB.energy)*.04;ORB.pulse*=.93;ORB.rot+=.003+ORB.energy*.008;
  const R=88*(1+ORB.pulse*.05+Math.sin(performance.now()/900)*.012),X=OS/2,Y=OS/2;
  const g=cx.createRadialGradient(X,Y,0,X,Y,R*1.45);g.addColorStop(0,'rgba(200,244,255,.95)');g.addColorStop(.4,`rgba(80,200,255,${.28+ORB.pulse*.15})`);g.addColorStop(1,'rgba(0,174,239,0)');cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,R*1.45,0,7);cx.fill();
  const cr=Math.cos(ORB.rot),sr=Math.sin(ORB.rot),ct=Math.cos(.35),st=Math.sin(.35);
  const P=PTS.map(([x,y,z,s,w])=>{const x1=x*cr-z*sr,z1=x*sr+z*cr;const y1=y*ct-z1*st,z2=y*st+z1*ct;return[x1,y1,z2,s,w];}).sort((a,b)=>a[2]-b[2]);
  if(DARK)cx.globalCompositeOperation='lighter';
  for(const[x,y,z,s,w]of P){const d=(z+1)/2,px=X+x*R,py=Y+y*R,rr=(1.1+d*2.5)*s*(R/120),e=Math.hypot(x,y);
    const h=w?198:205+e*20,l=w?93:64-e*16+d*6;cx.globalAlpha=DARK?1:.3+d*.65;const a=DARK?.22+d*.7:1;const gg=cx.createRadialGradient(px-rr*.35,py-rr*.35,rr*.1,px,py,rr);
    gg.addColorStop(0,`hsla(${h},100%,${Math.min(97,l+24)}%,${a})`);gg.addColorStop(1,`hsla(${h},${w?60:95}%,${l}%,${a})`);cx.fillStyle=gg;cx.beginPath();cx.arc(px,py,rr,0,7);cx.fill();}
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;const c=cx.createRadialGradient(X,Y,0,X,Y,R*.5);c.addColorStop(0,'rgba(255,255,255,.95)');c.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=c;cx.beginPath();cx.arc(X,Y,R*.5,0,7);cx.fill();}

/* ---------- stage: groups, focus, links, packets ---------- */
const SW=836,SH=778,OX=418,OY=330,RCX=418,RCY=370,RX=318,RY=300;
const GPOS={};
function buildStage(){$$('.grp',WORLD).forEach(e=>e.remove());
  WORLD.insertAdjacentHTML('beforeend',GROUPS.map(G=>{const a=G.ang*Math.PI/180;const x=RCX+RX*Math.cos(a),y=RCY+RY*Math.sin(a);GPOS[G.id]=[x,y];
    return `<div class="grp" id="g-${G.id}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px"><h6>${ic(G.i)}${G.l}</h6>${G.apps.map(id=>{const A=APPS[id];
      return `<div class="app" id="a-${id}">${mn(id)}<span class="ok">${ic('check')}</span><div class="tx"><div class="nm">${A.n}</div><div class="sb">${A.s}</div><span class="bd"></span></div><span class="st"><span class="si"></span></span></div>`}).join('')}</div>`}).join(''));}
const ST_IC={lock:'lock',auth:'key-round',sync:'refresh-cw',on:'circle-check',active:'loader',write:'pen-line',done:'',sup:'',idle:''};
function app(id,state,badge,sub){const el=$('#a-'+id);if(!el)return;el.className='app '+state+(el.classList.contains('fa')?' fa':'');el.querySelector('.si').innerHTML=ST_IC[state]?ic(ST_IC[state]):'';
  if(badge!=null)el.querySelector('.bd').textContent=badge;if(sub)el.querySelector('.sb').textContent=sub;
  GROUPS.forEach(G=>$('#g-'+G.id).classList.toggle('hot',G.apps.some(a=>/active|write/.test($('#a-'+a).className))));}
/* focus: the tool WATARI is working with grows; the rest of the map steps back */
let FOCUS=[];
function focus(ids){ids=[].concat(ids||[]);FOCUS=ids;STAGE.classList.toggle('focusing',ids.length>0);
  const fs=VARIANT.focusScale||1.5;
  GROUPS.forEach(G=>{const el=$('#g-'+G.id);if(!el)return;const on=G.apps.some(a=>ids.includes(a));el.classList.toggle('fo',on);
    if(on){const[x,y]=GPOS[G.id];const pull=VARIANT.pull??.24;const H=el.offsetHeight,W=172;let s=fs;
      const nw=$('#now'),nh=nw.offsetWidth,NR={l:418-nh/2-6,r:418+nh/2+6,t:490,b:496+nw.offsetHeight+6};
      let cx_=x+(RCX-x)*pull,cy_=y+(RCY-y)*pull;
      const clamp=()=>{cx_=Math.min(SW-8-W*s/2,Math.max(8+W*s/2,cx_));cy_=Math.min(SH-8-H*s/2,Math.max(8+H*s/2,cy_));};
      const hit=()=>cx_-W*s/2<NR.r&&cx_+W*s/2>NR.l&&cy_-H*s/2<NR.b&&cy_+H*s/2>NR.t;
      clamp();
      if(hit()){if(y>RCY&&Math.abs(x-RCX)<150){s=Math.min(s,(SH-8-NR.b)/H);cy_=NR.b+H*s/2;clamp();}
        else{const left=cx_<RCX;const avail=left?NR.l-8:SW-8-NR.r;s=Math.min(s,avail/W);cx_=left?NR.l-W*s/2:NR.r+W*s/2;clamp();}}
      el.style.setProperty('--fx',(cx_-x).toFixed(0)+'px');el.style.setProperty('--fy',(cy_-y).toFixed(0)+'px');el.style.setProperty('--fs',s.toFixed(3));}});
  $$('.app',WORLD).forEach(a=>a.classList.toggle('fa',ids.includes(a.id.slice(2))));
  if(VARIANT.focus==='camera'){if(!ids.length){WORLD.style.transform='';return;}const G=GROUPS.find(G=>G.apps.some(a=>ids.includes(a)));const[x,y]=GPOS[G.id];const s=1.2;
    const mx=(x*0.55+OX*0.45),my=(y*0.55+OY*0.45);let tx=SW/2-mx*s,ty=SH/2-my*s;tx=Math.min(0,Math.max(SW-SW*s,tx));ty=Math.min(0,Math.max(SH-SH*s,ty));WORLD.style.transform=`translate(${tx.toFixed(0)}px,${ty.toFixed(0)}px) scale(${s})`;}}
const LINKS={};
function svgBox(el){const s=$('#links').getBoundingClientRect(),q=s.width/SW||1,r=el.getBoundingClientRect();return{x:(r.left-s.left)/q,y:(r.top-s.top)/q,w:r.width/q,h:r.height/q};}
function anchor(id){const r=svgBox($('#a-'+id));return[Math.max(r.x,Math.min(OX,r.x+r.w)),Math.max(r.y,Math.min(OY,r.y+r.h))];}
function pathD(id){const[tx,ty]=anchor(id),dx=tx-OX,dy=ty-OY,L=Math.hypot(dx,dy)||1,sx=OX+dx/L*84,sy=OY+dy/L*84,mx=(sx+tx)/2,my=(sy+ty)/2,q=.13;return`M${sx.toFixed(1)},${sy.toFixed(1)} Q${(mx-dy*q).toFixed(1)},${(my+dx*q).toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)}`;}
function link(id,kind){let p=LINKS[id];if(!p){p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathD(id));$('#lk').appendChild(p);LINKS[id]=p;}p.setAttribute('class',kind);}
function relink(){Object.keys(LINKS).forEach(id=>LINKS[id].setAttribute('d',pathD(id)));}
const PK=[];
function packets(id,{n=5,dir='in',gap=130,dur=900,color}={}){if(INSTANT)return;const p=LINKS[id];if(!p)return;const now=performance.now();
  for(let i=0;i<n;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',dir==='in'?2.8:3.2);c.setAttribute('fill',color||(dir==='in'?'#00aeef':(DARK?'#bfeaff':'#062a5b')));$('#pk').appendChild(c);PK.push({p,c,t0:now+i*gap/SPEED,dur:dur/SPEED,dir});}}
async function stream(id,ms,opt={}){if(INSTANT)return;const g=GEN;let t=0;while(t<ms&&alive(g)){packets(id,{n:2,gap:110,...opt});await wait(260);t+=260;}}
let lastF=performance.now();
function frame(now){const dt=now-lastF;lastF=now;drawOrb();relink();
  for(let i=PK.length-1;i>=0;i--){const q0=PK[i];if(PAUSED){q0.t0+=dt;continue;}const q=(now-q0.t0)/q0.dur;if(q<0){q0.c.setAttribute('opacity',0);continue;}
    if(q>=1){q0.c.remove();PK.splice(i,1);if(q0.dir==='in')orbPulse(.08);continue;}const L=q0.p.getTotalLength();const e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;const pt=q0.p.getPointAtLength(q0.dir==='in'?L*(1-e):L*e);
    q0.c.setAttribute('cx',pt.x);q0.c.setAttribute('cy',pt.y);q0.c.setAttribute('opacity',Math.min(1,Math.sin(q*Math.PI)*1.6));}
  requestAnimationFrame(frame);}

let CHECKS=0,CHECKS_OK=0;
function recHTML(side,app_,kind,fields,state){if(state==='seek')return `<div class="rh">${mn(app_,'md')}<div><b>${APPS[app_].n}</b><small>${kind}</small></div></div><div class="seekt">${ic('loader')}Looking in ${APPS[app_].n}…</div><div class="seek"><i></i><i style="width:80%"></i><i style="width:65%"></i><i style="width:75%"></i></div>`;
  return `<div class="rh">${mn(app_,'md')}<div><b>${APPS[app_].n}</b><small>${kind}</small></div></div><dl>${fields.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>${kind.startsWith('Receipt')?'<div class="thumb"><i></i><i></i><i></i><i></i><i></i></div>':''}`;}
async function check(g,c){const v=openTab('trace','Cross-checking','wr');
  const A=$('#recA'),B=$('#recB'),M=$('#mid'),V=$('#verdict');
  focus(c.a.app);app(c.a.app,'active');link(c.a.app,'in');packets(c.a.app,{n:5});
  A.className='rec live';A.innerHTML=recHTML('A',c.a.app,c.a.kind,c.a.f);B.className='rec';B.innerHTML=`<div class="rh">${mn(c.b.app,'md')}<div><b>${APPS[c.b.app].n}</b><small>${c.b.kind}</small></div></div>`;
  M.className='mid seek';M.querySelector('.ms').innerHTML=ic('loader');$('#mrule').textContent=c.rule;V.className='verdict';V.innerHTML=ic('search')+c.q;
  now('arrow-left-right',c.q,`${APPS[c.a.app].n} → ${APPS[c.b.app].n} · ${c.rule}`,40,c.a.app);log('ai',c.log);
  await wait(1250);if(!alive(g))return;
  app(c.a.app,'done',c.a.badge);link(c.a.app,'done');
  focus(c.b.app);app(c.b.app,'active');link(c.b.app,'out');packets(c.b.app,{n:3,dir:'out'});A.className='rec';B.className='rec live';B.innerHTML=recHTML('B',c.b.app,c.b.kind,null,'seek');
  now('search',`Looking in ${APPS[c.b.app].n}`,c.rule,70,c.b.app);
  await wait(700);if(!alive(g))return;link(c.b.app,'in');packets(c.b.app,{n:5});await wait(650);if(!alive(g))return;
  B.innerHTML=recHTML('B',c.b.app,c.b.kind,c.b.f);B.classList.toggle('none',c.res==='warn');
  M.className='mid '+c.res;M.querySelector('.ms').innerHTML=ic(c.res==='ok'?'check':'triangle-alert');V.className='verdict '+c.res;V.innerHTML=ic(c.res==='ok'?'circle-check':'triangle-alert')+c.v;
  CHECKS++;if(c.res==='ok')CHECKS_OK++;$('#tr-n').textContent=CHECKS+' checks';$('#tr-ok').textContent=CHECKS_OK+' matched · '+(CHECKS-CHECKS_OK)+' flagged';
  $('#trail').insertAdjacentHTML('afterbegin',`<div class="tr-i">${mn(c.a.app,'sm')}<span class="ar">→</span>${mn(c.b.app,'sm')}<span class="tx">${c.t}</span><span class="pill ${c.res==='ok'?'g':'w'}">${c.res==='ok'?'matched':'flagged'}</span></div>`);
  while($('#trail').children.length>5)$('#trail').lastElementChild.remove();
  now(c.res==='ok'?'circle-check':'triangle-alert',c.v,`${APPS[c.a.app].n} ↔ ${APPS[c.b.app].n}`,100,c.b.app);
  log(c.res==='ok'?'ok':'wr',`${c.a.app} ↔ ${c.b.app} · ${c.res==='ok'?'matched':'flagged'}`);
  app(c.b.app,'done',c.b.badge);link(c.b.app,'done');
  await wait(1150);}
