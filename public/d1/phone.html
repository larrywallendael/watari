<!doctype html>
<html lang="en" data-role="phone"><head><meta charset="utf-8">
<base href="/d1/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Watari">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="core/icon-180.png"><link rel="icon" href="core/icon-180.png"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000">
<title>Watari Phone</title>
<link rel="stylesheet" href="core/phone.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation}
body.desk{display:grid;place-items:center;background:#e9eef5}
.wlogo{display:inline-grid;place-items:center;border-radius:8px;background:var(--lg);color:var(--lf);font-weight:800}.wlogo img{width:100%;height:100%;object-fit:contain}.wlogo img+b{display:none}</style>
</head><body>
<div id="ph"></div>
<script src="core/call.js"></script>
<script src="core/phone.js"></script>
<script>
// On a real phone: full screen. On a laptop: framed phone, so the page can be tested next to the stage.
const real=matchMedia('(max-width:520px)').matches;
const el=document.getElementById('ph');
if(!real){ document.body.classList.add('desk'); const fit=()=>{ el.style.setProperty('--s',Math.min(1,(innerHeight-40)/874)); }; addEventListener('resize',fit); fit(); }
W.Phone.mount(el,{mode:real?'device':'mirror',captions:true});
if(!real) document.querySelector('.ip-arm').hidden=false;
</script>
</body></html>
